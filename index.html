<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Epochmap · An atlas of world history</title>
    <meta
      name="description"
      content="The political map of the world for every year from 0 to 2026, on a 3D globe. Drag the timeline and watch empires rise and fall."
    />
    <meta name="theme-color" content="#04060c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Satellite tiles and Wikipedia summaries come from these hosts: open the connections early. -->
    <link rel="preconnect" href="https://gibs.earthdata.nasa.gov" crossorigin />
    <link rel="dns-prefetch" href="https://en.wikipedia.org" />
    <link rel="dns-prefetch" href="https://tr.wikipedia.org" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Epochmap · An atlas of world history" />
    <meta
      property="og:description"
      content="Every year from 0 to 2026 on a 3D globe: drag the timeline and watch empires rise and fall."
    />
    <meta property="og:url" content="https://berkanatik.github.io/epochmap/" />
    <meta property="og:image" content="https://berkanatik.github.io/epochmap/og.png" />
    <meta property="og:image:alt" content="A 3D globe showing the political map of the world in 1914" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://berkanatik.github.io/epochmap/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Epochmap needs JavaScript to draw the globe.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
